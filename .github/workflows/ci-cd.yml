name: ML Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc==3.58.0" "pathspec<0.12.0"

      - name: Lint
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Test
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  pipeline:
    name: 🔄 DVC Pipeline
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc==3.58.0" "pathspec<0.12.0"

      # ✅ FIX 1: Removed `dvc init` — .dvc/ is already in the repo

      # ✅ FIX 2: Start MLflow server so train/evaluate can connect
      - name: Start MLflow server
        run: |
          mlflow server \
            --host 127.0.0.1 \
            --port 5001 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns &
          # Wait until it's actually accepting connections
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:5001/health && break || sleep 2
          done

      # ✅ FIX 3: Override MLflow URI to point at the local server
      - name: Run DVC pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MLFLOW_TRACKING_URI: "http://127.0.0.1:5001"
        run: |
          dvc repro

      - name: Show metrics
        run: dvc metrics show

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            models/
            metrics/
            data/processed/
            mlruns/         # optional: persist MLflow run history

  docker:
    name: 🐳 Docker Build & Push
    needs: pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pipeline-artifacts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/youtube-sentiment-analysis:latest
            ${{ secrets.DOCKER_USERNAME }}/youtube-sentiment-analysis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max