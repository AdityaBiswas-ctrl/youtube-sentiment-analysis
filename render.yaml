services:
  - type: web
    name: youtube-sentiment-analysis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT src.api.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: YOUTUBE_API_KEY
        sync: false # Set this in the Render dashboard for security
      - key: PORT
        value: 5000
