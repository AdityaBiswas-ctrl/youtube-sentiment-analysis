version: "3.9"

services:
  # ── YouTube Sentiment Analysis App ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-sentiment-app
    ports:
      - "5000:5000"
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./metrics:/app/metrics
      - ./configs:/app/configs
    restart: unless-stopped
    networks:
      - sentiment-network

  # ── MLflow Tracking Server ──
  mlflow:
    image: python:3.11-slim
    container_name: yt-sentiment-mlflow
    command: >
      bash -c "
        pip install --quiet mlflow==2.21.3 &&
        mlflow server
          --host 0.0.0.0
          --port 5001
          --backend-store-uri sqlite:///mlflow/mlflow.db
          --default-artifact-root /mlflow/artifacts
      "
    ports:
      - "5001:5001"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - sentiment-network

volumes:
  mlflow_data:
    driver: local

networks:
  sentiment-network:
    driver: bridge
